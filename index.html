    function App() {
      // 1. User & Auth State (FR1, FR11)

      // 2. Watchlist State (FR5, FR6, FR7, FR8, FR9, FR10)
      const [watchlist, setWatchlist] = useState(() => {
        const saved = localStorage.getItem('anitrack_wl');
        return saved ? JSON.parse(saved) : DEFAULT_WATCHLIST;
      });

      // 3. Navigation & UI State
      const [activeTab, setActiveTab] = useState('home'); // 'home' | 'explore' | 'watchlist' | 'progress' | 'profile' | 'settings'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedAnime, setSelectedAnime] = useState(null);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [isPremiumModalOpen, setIsPremiumModalOpen] = useState(false);
      const [isNotifOpen, setIsNotifOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [exploreGenre, setExploreGenre] = useState('All');
      const [watchlistFilter, setWatchlistFilter] = useState('All');
      const [sortBy, setSortBy] = useState('popularity');

      // Persistence
      useEffect(() => {
        localStorage.setItem('anitrack_user', JSON.stringify(user));
      }, [user]);

      useEffect(() => {
        localStorage.setItem('anitrack_wl', JSON.stringify(watchlist));
      }, [watchlist]);

      // Toast notification helper
      const showToast = (message, type = 'info') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(null), 3500);
      };

      // Real-time Dynamic Statistics (FR8)
      const stats = useMemo(() => {
        const watching = watchlist.filter(w => w.status === 'Watching');
        const completed = watchlist.filter(w => w.status === 'Completed');
        const totalEp = watchlist.reduce((sum, item) => sum + (Number(item.episodesWatched) || 0), 0);
        return {
          watchingCount: watching.length,
          completedCount: completed.length,
          totalEpisodes: totalEp
        };
      }, [watchlist]);

      // Lookup Anime Metadata
      const getAnime = (id, fallback = {}) => {
        const found = MASTER_ANIME.find(a => a.id === id);
        if (found) return found;
        return {
          id: id,
          title: fallback.title || 'Anime Series',
          rating: 8.5,
          totalEpisodes: fallback.totalEpisodes || 24,
          image: fallback.image || './assets/pop_one_piece.png',
          banner: './assets/hero_banner.png',
          status: 'Finished Airing',
          genres: ['Action', 'Fantasy'],
          studio: 'Animation Studio',
          synopsis: 'An exciting story tracked in your AniTrack profile.'
        };
      };

      // FR6 & FR10: Episode Tracking & Auto-completion
      const handleEpisodeChange = (animeId, newCount) => {
        const target = watchlist.find(w => w.animeId === animeId);
        const anime = getAnime(animeId, target);
        const max = anime.totalEpisodes || 1000;
        const clamped = Math.max(0, Math.min(newCount, max));

        let newStatus = target?.status || 'Watching';
        let didComplete = false;

        // FR10: Automatically mark Completed when watched episodes equal total episodes
        if (clamped >= max && newStatus !== 'Completed') {
          newStatus = 'Completed';
          didComplete = true;
        } else if (clamped < max && newStatus === 'Completed' && newCount < (target?.episodesWatched || 0)) {
          newStatus = 'Watching';
        }

        setWatchlist(prev => {
          const exists = prev.some(w => w.animeId === animeId);
          if (exists) {
            return prev.map(w => w.animeId === animeId ? {
              ...w,
              episodesWatched: clamped,
              status: newStatus,
              updatedAt: new Date().toISOString()
            } : w);
          } else {
            return [{
              animeId,
              status: newStatus,
              episodesWatched: clamped,
              score: null,
              updatedAt: new Date().toISOString()
            }, ...prev];
          }
        });

        if (didComplete) {
          try {
            confetti({ particleCount: 90, spread: 80, origin: { y: 0.6 } });
          } catch(e){}

                    />
                    <div>
                      <h3 className="text-xl font-black text-white">{selectedAnime.title}</h3>
                      <p className="text-xs text-purple-300 font-semibold mt-0.5">
                        {selectedAnime.studio} • {selectedAnime.year || 2020} • ★ {selectedAnime.rating}
                      </p>
                    </div>
                  </div>

                  {/* Genre Badges */}
                  <div className="flex flex-wrap gap-1.5 pt-2">
                    {selectedAnime.genres.map(g => (
                      <span key={g} className="px-2.5 py-0.5 rounded-full bg-purple-950/80 border border-purple-500/30 text-[11px] font-semibold text-purple-300">
                        {g}
                      </span>
                    ))}
                  </div>

                  {/* Synopsis */}
                  <p className="text-xs text-gray-300 leading-relaxed max-h-28 overflow-y-auto">
                    {selectedAnime.synopsis}
                  </p>

                  {/* Watchlist Controls (FR5, FR6, FR10) */}
                  <div className="pt-4 border-t border-purple-950/60 flex flex-wrap items-center justify-between gap-4">
                    {(() => {
                      const entry = watchlist.find(w => w.animeId === selectedAnime.id);
                      return (
                        <>
                          <div className="flex items-center space-x-2">
                            <span className="text-xs text-gray-400 font-medium">Status:</span>
                            <select
                              value={entry?.status || 'None'}
                              onChange={(e) => {
                                if (e.target.value === 'None') {
                                  handleRemove(selectedAnime.id);
                                } else {
                                  handleStatusChange(selectedAnime.id, e.target.value);
                                }
                              }}
                              className="bg-[#1f1a3b] border border-[#2f2757] text-xs font-semibold text-white rounded-xl px-3 py-1.5 focus:outline-none"
                            >
                              <option value="None">Not in list</option>
                              <option value="Watching">Watching</option>
                              <option value="Completed">Completed</option>
                              <option value="Plan to Watch">Plan to Watch</option>
                              <option value="Dropped">Dropped</option>
                            </select>
                          </div>

                          {entry && (
                            <div className="flex items-center space-x-3">
                              <span className="text-xs text-gray-400">Watched:</span>
                              <div className="flex items-center space-x-2">
                                <button
                                  onClick={() => handleEpisodeChange(selectedAnime.id, (entry.episodesWatched || 0) - 1)}
                                  className="w-7 h-7 rounded bg-[#201c3b] hover:bg-purple-700 text-white flex items-center justify-center font-bold text-xs"
                                >
                                  -
                                </button>
                                <span className="text-xs font-bold text-white px-1">
                                  {entry.episodesWatched} / {selectedAnime.totalEpisodes}
                                </span>
                                <button
                                  onClick={() => handleEpisodeChange(selectedAnime.id, (entry.episodesWatched || 0) + 1)}
                                  className="w-7 h-7 rounded bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center font-bold text-xs"
                                >
                                  +
                                </button>
                              </div>
                            </div>
                          )}
                        </>
                      );
                    })()}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= GO PREMIUM MODAL ================= */}
          {isPremiumModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#141126] border border-purple-800/40 rounded-3xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl relative">
                <button
                  onClick={() => setIsPremiumModalOpen(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white"
                >
                  <Icons.Close className="w-5 h-5" />
                </button>

                <div className="w-14 h-14 mx-auto rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                  <Icons.Crown className="w-7 h-7" />
                </div>

                <h3 className="text-xl font-black text-white">Upgrade to AniTrack PRO</h3>
                <p className="text-xs text-gray-300">
                  Take your tracking to the next level with exclusive PRO perks.
                </p>

                <div className="text-left space-y-2 py-2">
                  <div className="text-xs text-gray-200 flex items-center space-x-2">
                    <span className="text-emerald-400">✓</span>
                    <span>Unlimited personal custom watchlists & tags</span>
                  </div>
                  <div className="text-xs text-gray-200 flex items-center space-x-2">
                    <span className="text-emerald-400">✓</span>
                    <span>Advanced analytics, hours tracked, and export to CSV/JSON</span>
                  </div>
                  <div className="text-xs text-gray-200 flex items-center space-x-2">
                    <span className="text-emerald-400">✓</span>
                    <span>Exclusive VIP badges & anime avatar frames</span>
                  </div>
                  <div className="text-xs text-gray-200 flex items-center space-x-2">
                    <span className="text-emerald-400">✓</span>
                    <span>Real-time airing push reminders for new episodes</span>
                  </div>
                </div>

                <button
                  onClick={() => {
                    setUser(prev => ({ ...prev, isPremium: true }));
                    setIsPremiumModalOpen(false);
                    try { confetti({ particleCount: 100, spread: 70 }); }catch(e){}
                    showToast('🎉 You are now an AniTrack PRO Member!', 'success');
                  }}
                  className="w-full py-3 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm shadow-xl shadow-purple-900/50 transition"
                >
                  Activate PRO (Lifetime Free Demo)
                </button>
              </div>
            </div>
          )}

          {/* ================= AUTH MODAL (FR1) ================= */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#141126] border border-purple-800/40 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
                <button
                  onClick={() => setIsAuthModalOpen(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white"
                >
                  <Icons.Close className="w-5 h-5" />
                </button>

                <h3 className="text-xl font-black text-white text-center">
                  {authMode === 'login' ? 'Sign In to AniTrack' : 'Create an Account'}
                </h3>
                <p className="text-xs text-gray-400 text-center">
                  {authMode === 'login' ? 'Enter your credentials to manage your watchlist' : 'Join thousands of anime fans tracking progress'}
                </p>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const name = e.target.username.value || 'Harish';
                    setUser({
                      username: name,
                      displayName: name,
                      avatar: './assets/avatar.png',
                      email: `${name.toLowerCase()}@anitrack.io`,
                      isPremium: false
                    });
                    setIsAuthModalOpen(false);
                    showToast(`Signed in as ${name}!`, 'success');
                  }}
                  className="space-y-3"
                >
                  <div>
                    <label className="text-[11px] font-semibold text-gray-300">Username</label>
                    <input
                      name="username"
                      defaultValue="Harish"
                      required
                      className="mt-1 w-full px-3 py-2 bg-[#1b1735] border border-[#2e265c] rounded-xl text-xs text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-semibold text-gray-300">Password</label>
                    <input
                      type="password"
                      defaultValue="password123"
                      required
                      className="mt-1 w-full px-3 py-2 bg-[#1b1735] border border-[#2e265c] rounded-xl text-xs text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>
                  <button
                    type="submit"
                    className="mt-4 w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs transition"
                  >
                    {authMode === 'login' ? 'Sign In' : 'Register'}
                  </button>
                </form>

                <div className="text-center pt-2">
                  <button
                    onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                    className="text-xs text-purple-400 hover:underline"
                  >
                    {authMode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
